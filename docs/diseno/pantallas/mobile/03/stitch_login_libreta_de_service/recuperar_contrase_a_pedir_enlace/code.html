<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary": "#785900", "inverse-primary": "#b1c5ff", "secondary-fixed": "#ffdf9d", "on-primary": "#ffffff", "status-error-container": "#FEE4E2", "surface-dim": "#d1daeb", "text-muted": "#5A6472", "status-success-text": "#1E6B43", "status-warning-container": "#FFEDD5", "outline": "#747783", "on-surface": "#131c28", "on-primary-fixed": "#001947", "surface-bright": "#f8f9ff", "secondary-container": "#fcc019", "surface-container": "#EFECE5", "surface-container-high": "#e0e9f9", "primary-fixed-dim": "#b1c5ff", "background": "#f8f9ff", "surface": "#f8f9ff", "on-error": "#ffffff", "status-uncertain-border": "#8C82D6", "on-primary-fixed-variant": "#144296", "status-error-text": "#B42318", "text-ink": "#1B2430", "primary-container": "#E3EAF6", "surface-tint": "#345baf", "primary-fixed": "dae2ff", "tertiary-fixed-dim": "#c7bfff", "background-paper": "#F6F4EF", "tertiary-fixed": "#e4dfff", "on-primary-container": "#8dadff", "border-outline": "#8A8F98", "on-secondary-fixed": "#251a00", "on-secondary-container": "#6c5000", "on-tertiary-fixed-variant": "#43369b", "surface-container-lowest": "#ffffff", "tertiary-container": "#3e3196", "status-uncertain-text": "#4B3FA3", "outline-variant": "#c4c6d3", "status-success-container": "#E5F2EA", "on-tertiary-fixed": "#170065", "error-container": "#ffdad6", "status-warning-text": "#9A3412", "on-tertiary-container": "#ada4ff", "primary": "#002869", "on-surface-variant": "#434652", "inverse-surface": "#28313d", "on-secondary-fixed-variant": "#5b4300", "surface-container-low": "#eff4ff", "surface-variant": "#dae3f4", "on-secondary": "#ffffff", "tertiary": "#27157f", "status-uncertain-container": "#EDEBFA", "border-divider": "#E3DFD6", "on-error-container": "#93000a", "surface-card": "#FFFFFF", "on-tertiary": "#ffffff", "secondary-fixed-dim": "#f9bd14", "inverse-on-surface": "#eaf1ff", "surface-container-highest": "#dae3f4", "primary-hover": "#08306F", "on-background": "#131c28", "error": "#ba1a1a" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-2xl": "2rem", "space-xl": "1.5rem", "space-lg": "1rem", "space-md": "0.75rem", "space-sm": "0.5rem", "gutter-desktop": "1.5rem", "margin": "1rem", "space-xs": "0.25rem", "margin-desktop": "2rem", "gutter": "1rem" }, fontFamily: { "headline-sm": ["Public Sans"], "label-md": ["Public Sans"], "headline-lg": ["Public Sans"], "km-display": ["Public Sans"], "caption": ["Public Sans"], "body-md": ["Public Sans"], "body-sm": ["Public Sans"], "data-tabular": ["Public Sans"] }, fontSize: { "headline-sm": ["17px", { lineHeight: "24px", fontWeight: "600" }], "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }], "headline-lg": ["22px", { lineHeight: "28px", fontWeight: "600" }], "km-display": ["28px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "600" }], "caption": ["13px", { lineHeight: "18px", fontWeight: "400" }], "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }], "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }], "data-tabular": ["14px", { lineHeight: "20px", fontWeight: "500" }] } } } };</script><style>@layer base{html,body{min-height:100%;margin:0;padding:0;}body{-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-background-paper text-text-ink min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-background-paper px-margin max-w-[720px] mx-auto"><div class="flex flex-col w-full">
<div class="flex items-center justify-start pt-space-md pb-space-lg">
<a aria-label="Volver" class="inline-flex items-center gap-space-xs text-primary hover:text-primary-hover focus:outline-none transition-colors" href="#">
<span aria-hidden="true" class="material-symbols-outlined text-[24px] select-none">arrow_back</span>
<span class="font-label-md text-label-md">Volver</span>
</a>
</div>
<div class="flex flex-col gap-space-sm pb-space-xl">
<h1 class="font-headline-lg text-headline-lg text-text-ink tracking-tight">
      Recuperar contraseña
    </h1>
<p class="font-body-md text-body-md text-text-muted">
      Ingresá el correo de tu cuenta y te mandamos un enlace para elegir una contraseña nueva.
    </p>
</div>
<form class="flex flex-col w-full gap-space-xl" id="recovery-form" onsubmit="event.preventDefault(); handleSubmit();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="recovery-email">
        Correo electrónico
      </label>
<input autocomplete="email" class="w-full h-[48px] px-space-md bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] border border-border-outline focus:border-[2px] focus:border-primary focus:outline-none transition-all placeholder:text-text-muted/60" id="recovery-email" name="email" placeholder="ejemplo@correo.com" required="" type="email" value="propietario@example.com">
<p class="hidden font-caption text-caption text-status-error-text mt-space-xs" id="email-error">
        Ingresá un correo electrónico válido para continuar.
      </p>
</div>
<div class="flex flex-col w-full pt-space-xs">
<button class="w-full h-[48px] bg-primary hover:bg-primary-hover active:bg-primary-hover text-on-primary font-label-md text-label-md rounded-[10px] flex items-center justify-center transition-colors focus:outline-none cursor-pointer" id="submit-btn" type="submit">
<span class="">Enviar enlace</span>
</button>
</div>
</form>
<div class="flex justify-center items-center pt-space-2xl pb-space-lg">
<p class="font-body-sm text-body-sm text-text-muted text-center">
      ¿Te acordaste de la contraseña? 
      <a class="text-primary hover:text-primary-hover font-label-md text-label-md underline underline-offset-2 ml-1" href="#">Ingresar</a>
</p>
</div>
</div>
<script>
  function handleSubmit() {
    const input = document.getElementById('recovery-email');
    const errorMsg = document.getElementById('email-error');
    const submitBtn = document.getElementById('submit-btn');
    
    if (!input.value || !input.checkValidity()) {
      input.classList.remove('border-border-outline', 'focus:border-primary');
      input.classList.add('border-[1.5px]', 'border-status-error-text');
      errorMsg.classList.remove('hidden');
      input.focus();
      return;
    }

    input.classList.remove('border-[1.5px]', 'border-status-error-text');
    input.classList.add('border-border-outline', 'focus:border-primary');
    errorMsg.classList.add('hidden');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Enviando enlace...</span>';
    submitBtn.classList.add('opacity-90', 'cursor-not-allowed');

    setTimeout(() => {
      submitBtn.innerHTML = '<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">check</span> Enlace enviado</span>';
      submitBtn.classList.remove('bg-primary', 'hover:bg-primary-hover');
      submitBtn.classList.add('bg-status-success-text');
    }, 800);
  }
</script></main>

</body></html>
