<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary": "#785900", "inverse-primary": "#b1c5ff", "secondary-fixed": "#ffdf9d", "on-primary": "#ffffff", "status-error-container": "#FEE4E2", "surface-dim": "#d1daeb", "text-muted": "#5A6472", "status-success-text": "#1E6B43", "status-warning-container": "#FFEDD5", "outline": "#747783", "on-surface": "#131c28", "on-primary-fixed": "#001947", "surface-bright": "#f8f9ff", "secondary-container": "#fcc019", "surface-container": "#EFECE5", "surface-container-high": "#e0e9f9", "primary-fixed-dim": "#b1c5ff", "background": "#f8f9ff", "surface": "#f8f9ff", "on-error": "#ffffff", "status-uncertain-border": "#8C82D6", "on-primary-fixed-variant": "#144296", "status-error-text": "#B42318", "text-ink": "#1B2430", "primary-container": "#E3EAF6", "surface-tint": "#345baf", "primary-fixed": "dae2ff", "tertiary-fixed-dim": "#c7bfff", "background-paper": "#F6F4EF", "tertiary-fixed": "#e4dfff", "on-primary-container": "#8dadff", "border-outline": "#8A8F98", "on-secondary-fixed": "#251a00", "on-secondary-container": "#6c5000", "on-tertiary-fixed-variant": "#43369b", "surface-container-lowest": "#ffffff", "tertiary-container": "#3e3196", "status-uncertain-text": "#4B3FA3", "outline-variant": "#c4c6d3", "status-success-container": "#E5F2EA", "on-tertiary-fixed": "#170065", "error-container": "#ffdad6", "status-warning-text": "#9A3412", "on-tertiary-container": "#ada4ff", "primary": "#002869", "on-surface-variant": "#434652", "inverse-surface": "#28313d", "on-secondary-fixed-variant": "#5b4300", "surface-container-low": "#eff4ff", "surface-variant": "#dae3f4", "on-secondary": "#ffffff", "tertiary": "#27157f", "status-uncertain-container": "#EDEBFA", "border-divider": "#E3DFD6", "on-error-container": "#93000a", "surface-card": "#FFFFFF", "on-tertiary": "#ffffff", "secondary-fixed-dim": "#f9bd14", "inverse-on-surface": "#eaf1ff", "surface-container-highest": "#dae3f4", "primary-hover": "#08306F", "on-background": "#131c28", "error": "#ba1a1a" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-2xl": "2rem", "space-xl": "1.5rem", "space-lg": "1rem", "space-md": "0.75rem", "space-sm": "0.5rem", "gutter-desktop": "1.5rem", "margin": "1rem", "space-xs": "0.25rem", "margin-desktop": "2rem", "gutter": "1rem" }, fontFamily: { "headline-sm": ["Public Sans"], "label-md": ["Public Sans"], "headline-lg": ["Public Sans"], "km-display": ["Public Sans"], "caption": ["Public Sans"], "body-md": ["Public Sans"], "body-sm": ["Public Sans"], "data-tabular": ["Public Sans"] }, fontSize: { "headline-sm": ["17px", { lineHeight: "24px", fontWeight: "600" }], "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }], "headline-lg": ["22px", { lineHeight: "28px", fontWeight: "600" }], "km-display": ["28px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "600" }], "caption": ["13px", { lineHeight: "18px", fontWeight: "400" }], "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }], "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }], "data-tabular": ["14px", { lineHeight: "20px", fontWeight: "500" }] } } } };</script><style>@layer base{html,body{min-height:100%;margin:0;padding:0;}body{-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-background-paper text-text-ink min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-background-paper px-margin max-w-[720px] mx-auto"><div class="flex flex-col w-full text-text-ink">
<header class="flex items-center gap-space-sm pt-space-lg pb-space-2xl">
<div class="w-8 h-8 rounded-[8px] bg-primary flex items-center justify-center flex-shrink-0">
<svg class="w-5 h-5 text-secondary-fixed-dim" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
</svg>
</div>
<span class="font-headline-sm text-body-md text-text-ink tracking-tight font-semibold">Libreta de service</span>
</header>
<div class="flex flex-col gap-space-xs mb-space-2xl">
<h1 class="font-headline-lg text-headline-lg text-text-ink">Elegí una contraseña nueva</h1>

</div>
<form class="flex flex-col w-full" id="reset-password-form" onsubmit="event.preventDefault(); handleFormSubmit();">
<div class="flex flex-col mb-space-xl">
<label class="font-label-md text-label-md text-text-ink mb-space-xs" for="new-password">Contraseña nueva</label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-12 px-3 pr-11 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] border border-border-outline focus:outline-none focus:border-2 focus:border-primary transition-colors" id="new-password" minlength="8" name="new-password" placeholder="••••••••" required="" type="password">
<button aria-label="Alternar visibilidad de la contraseña" class="absolute right-0 top-0 h-12 w-11 flex items-center justify-center text-text-muted hover:text-text-ink focus:outline-none" onclick="toggleVisibility('new-password', 'eye-icon-1')" type="button">
<span class="material-symbols-outlined text-[20px] select-none" id="eye-icon-1">visibility</span>
</button>
</div>
<p class="font-caption text-caption text-text-muted mt-space-xs" id="password-hint">Mínimo 8 caracteres.</p>
</div>
<div class="flex flex-col mb-space-2xl">
<label class="font-label-md text-label-md text-text-ink mb-space-xs" for="confirm-password">Repetí la contraseña</label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-12 px-3 pr-11 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] border border-border-outline focus:outline-none focus:border-2 focus:border-primary transition-colors" id="confirm-password" minlength="8" name="confirm-password" placeholder="••••••••" required="" type="password">
<button aria-label="Alternar visibilidad de repetir contraseña" class="absolute right-0 top-0 h-12 w-11 flex items-center justify-center text-text-muted hover:text-text-ink focus:outline-none" onclick="toggleVisibility('confirm-password', 'eye-icon-2')" type="button">
<span class="material-symbols-outlined text-[20px] select-none" id="eye-icon-2">visibility</span>
</button>
</div>
<p class="hidden font-caption text-caption text-status-error-text mt-space-xs" id="error-message">Las contraseñas no coinciden. Verificalas antes de continuar.</p>
</div>
<button class="w-full h-12 bg-primary hover:bg-primary-hover active:bg-primary-hover text-on-primary font-label-md text-label-md rounded-[10px] flex items-center justify-center font-medium transition-colors" id="submit-btn" type="submit">
      Guardar contraseña
    </button>
</form>
<div class="hidden mt-space-xl p-space-md rounded-[10px] bg-status-success-container border border-border-divider" id="success-banner">
<div class="flex items-start gap-space-sm">
<span class="material-symbols-outlined text-status-success-text text-[20px] mt-0.5">check_circle</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-status-success-text font-semibold">Contraseña actualizada</span>
<span class="font-caption text-caption text-status-success-text mt-0.5">Ya podés ingresar con tu nueva clave.</span>
</div>
</div>
</div>
<footer class="mt-space-2xl pt-space-xl border-t border-border-divider flex justify-start">
<a class="font-label-md text-label-md text-primary font-medium hover:underline inline-flex items-center gap-space-xs" href="#"><span class="material-symbols-outlined text-[18px]">arrow_back</span>
      Volver a ingresar
    </a>
</footer>
</div>
<script>
  function toggleVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleFormSubmit() {
    const p1 = document.getElementById('new-password');
    const p2 = document.getElementById('confirm-password');
    const errorMsg = document.getElementById('error-message');
    const hint = document.getElementById('password-hint');
    const banner = document.getElementById('success-banner');
    const submitBtn = document.getElementById('submit-btn');

    if (!p1 || !p2) return;

    if (p1.value.length < 8) {
      p1.classList.add('border-status-error-text');
      hint.classList.add('text-status-error-text');
      p1.focus();
      return;
    } else {
      p1.classList.remove('border-status-error-text');
      hint.classList.remove('text-status-error-text');
    }

    if (p1.value !== p2.value) {
      p2.classList.add('border-status-error-text');
      errorMsg.classList.remove('hidden');
      p2.focus();
      return;
    }

    p2.classList.remove('border-status-error-text');
    errorMsg.classList.add('hidden');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Guardando...';

    setTimeout(() => {
      submitBtn.textContent = 'Contraseña guardada';
      banner.classList.remove('hidden');
    }, 400);
  }
</script></main>

</body></html>
