<!DOCTYPE html><html class="h-full" lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-container": "#6c5000", "inverse-surface": "#28313d", "on-surface-variant": "#434652", "surface-container-lowest": "#ffffff", "primary-hover": "#08306F", "status-uncertain-border": "#8C82D6", "on-background": "#131c28", "on-primary-fixed-variant": "#144296", "on-error": "#ffffff", "tertiary-container": "#3e3196", "text-muted": "#5A6472", "status-error-text": "#B42318", "border-outline": "#8A8F98", "on-tertiary-fixed": "#170065", "secondary-fixed-dim": "#f9bd14", "on-tertiary-fixed-variant": "#43369b", "status-success-container": "#E5F2EA", "tertiary-fixed-dim": "#c7bfff", "surface-bright": "#f8f9ff", "error-container": "#ffdad6", "on-primary-container": "#8dadff", "primary-container": "#E3EAF6", "secondary": "#785900", "surface-dim": "#d1daeb", "surface-card": "#FFFFFF", "status-uncertain-container": "#EDEBFA", "text-ink": "#1B2430", "status-error-container": "#FEE4E2", "on-tertiary": "#ffffff", "surface-container-low": "#eff4ff", "on-secondary-fixed": "#251a00", "primary-fixed-dim": "#b1c5ff", "status-uncertain-text": "#4B3FA3", "on-tertiary-container": "#ada4ff", "tertiary-fixed": "#e4dfff", "tertiary": "#27157f", "inverse-on-surface": "#eaf1ff", "on-secondary-fixed-variant": "#5b4300", "surface-container-high": "#e0e9f9", "status-success-text": "#1E6B43", "status-warning-text": "#9A3412", "on-primary-fixed": "#001947", "inverse-primary": "#b1c5ff", "surface-container-highest": "#dae3f4", "surface-container": "#EFECE5", "status-warning-container": "#FFEDD5", "on-surface": "#131c28", "border-divider": "#E3DFD6", "surface-tint": "#345baf", "background-paper": "#F6F4EF", "background": "#f8f9ff", "outline-variant": "#c4c6d3", "outline": "#747783", "on-error-container": "#93000a", "on-secondary": "#ffffff", "primary-fixed": "#dae2ff", "surface-variant": "#dae3f4", "error": "#ba1a1a", "primary": "#002869", "secondary-fixed": "#ffdf9d", "on-primary": "#ffffff", "surface": "#f8f9ff", "secondary-container": "#fcc019" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-xs": "0.25rem", "space-lg": "1rem", "space-2xl": "2rem", "margin-desktop": "2rem", "gutter-desktop": "1.5rem", "gutter": "1rem", "space-sm": "0.5rem", "space-md": "0.75rem", "space-xl": "1.5rem" }, fontFamily: { "headline-sm": ["Public Sans"], "label-md": ["Public Sans"], "km-display": ["Public Sans"], "body-sm": ["Public Sans"], "body-md": ["Public Sans"], "caption": ["Public Sans"], "headline-lg": ["Public Sans"], "data-tabular": ["Public Sans"] }, fontSize: { "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }] } } } };</script><style>@layer base { html, body { min-height: 100%; margin: 0; padding: 0; } body { overscroll-behavior-y: none; font-family: 'Public Sans', sans-serif; background-color: #F6F4EF; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-background-paper text-text-ink min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-fixed"><main class="flex-1 flex flex-col w-full max-w-[720px] mx-auto bg-background-paper pt-safe pb-safe"><div class="flex flex-col w-full px-5 py-8 box-border">
<!-- Cabecera de Identidad: Logotipo Km 12 -->
<header class="flex flex-col items-start w-full">
<div class="flex items-center gap-3">
<!-- Símbolo vectorial del mojón de ruta (Roadside milestone / Hito kilométrico) -->
<svg aria-hidden="true" class="w-[32px] h-[40px] shrink-0" fill="none" viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg">
<!-- Cuerpo del mojón: semicírculo superior y base recta -->
<path d="M0 16C0 7.16344 7.16344 0 16 0C24.8366 0 32 7.16344 32 16V40H0V16Z" fill="#0B3D91"></path>
<!-- Testigo / baliza en arco en color oro #F2B705 -->
<path d="M5 16C5 9.92487 9.92487 5 16 5C22.0751 5 27 9.92487 27 16" stroke="#F2B705" stroke-linecap="round" stroke-width="3"></path>
<!-- Número 12 central en Public Sans Bold blanco -->
<text fill="#FFFFFF" font-family="'Public Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="-0.5px" text-anchor="middle" x="16" y="29">12</text>
</svg>
<!-- Nombre de Marca -->
<span class="font-headline-lg text-headline-lg text-text-ink tracking-tight">
        Km 12
      </span>
</div>
<!-- Bajada descriptiva de servicio -->
<p class="mt-2.5 font-body-sm text-body-sm text-text-muted">Sabé qué le toca a tu auto, y cuándo.</p>
</header>
<!-- Contenedor del Formulario de Ingreso -->
<section class="mt-9 flex flex-col w-full">
<h1 class="font-headline-lg text-headline-lg text-text-ink">
      Ingresar
    </h1>
<form class="mt-6 flex flex-col w-full space-y-4" onsubmit="event.preventDefault();">
<!-- Campo Correo Electrónico -->
<div class="flex flex-col w-full space-y-1.5">
<label class="font-label-md text-label-md text-text-ink" for="email-input">
          Correo electrónico
        </label>
<input autocomplete="email" class="h-12 w-full bg-white text-text-ink font-body-md text-body-md px-3.5 border rounded-[10px] outline-none focus:border-[#0B3D91] transition-colors" id="email-input" name="email" required="" style="border-color: #8A8F98;" type="email" value="propietario@example.com">
</div>
<!-- Campo Contraseña -->
<div class="flex flex-col w-full space-y-1.5">
<label class="font-label-md text-label-md text-text-ink" for="password-input">
          Contraseña
        </label>
<div class="relative flex items-center w-full bg-white border rounded-[10px] focus-within:border-[#0B3D91] transition-colors" style="border-color: #8A8F98;">
<input autocomplete="current-password" class="h-12 w-full bg-transparent text-text-ink font-body-md text-body-md pl-3.5 pr-11 rounded-[10px] outline-none" id="password-input" name="password" required="" type="password" value="ContraseñaSegura123">
<!-- Botón de visibilidad de contraseña -->
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-0 top-0 h-12 w-11 flex items-center justify-center text-text-muted hover:text-text-ink focus:outline-none" id="toggle-password-btn" type="button">
<!-- Ícono lineal de ojo -->
<svg aria-hidden="true" class="w-5 h-5" fill="none" id="eye-icon" stroke="#5A6472" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<!-- Enlace Recuperar Contraseña -->
<div class="flex justify-end pt-1">
<a class="font-body-sm text-body-sm underline hover:opacity-85 focus:outline-none" href="#" style="color: #0B3D91;">
          Olvidé mi contraseña
        </a>
</div>
<!-- Botón de Acción Principal -->
<div class="pt-5">
<button class="h-12 w-full text-white font-label-md text-label-md rounded-[10px] flex items-center justify-center hover:bg-[#08306F] active:bg-[#062453] transition-colors focus:outline-none" style="background-color: #0B3D91;" type="submit">
          Ingresar
        </button>
</div>
</form>
<!-- Navegación a Registro -->
<div class="mt-6 flex items-center justify-center font-body-sm text-body-sm text-text-muted">
<span class="">¿No tenés cuenta?&nbsp;</span>
<a class="underline font-label-md hover:opacity-85 focus:outline-none" href="#" style="color: #0B3D91;">
        Crear cuenta
      </a>
</div>
</section>
</div>
<script>
  (function () {
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeIcon.innerHTML = `
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" y1="2" x2="22" y2="22" />
          `;
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeIcon.innerHTML = `
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          `;
        }
      });
    }
  })();
</script></main>

</body></html>
