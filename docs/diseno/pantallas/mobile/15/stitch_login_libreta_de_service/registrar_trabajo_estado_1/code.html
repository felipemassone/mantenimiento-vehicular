<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-container": "#ada4ff", "status-error-container": "#FEE4E2", "status-success-text": "#1E6B43", "surface-container-highest": "#dae3f4", "surface-container": "#EFECE5", "on-tertiary-fixed-variant": "#43369b", "on-error": "#ffffff", "secondary": "#785900", "border-outline": "#8A8F98", "on-error-container": "#93000a", "border-divider": "#E3DFD6", "on-secondary-fixed-variant": "#5b4300", "on-primary-fixed-variant": "#144296", "on-tertiary-fixed": "#170065", "inverse-primary": "#b1c5ff", "status-uncertain-container": "#EDEBFA", "error": "#ba1a1a", "surface-container-lowest": "#ffffff", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "on-surface-variant": "#434652", "on-primary-container": "#8dadff", "inverse-surface": "#28313d", "status-uncertain-border": "#8C82D6", "inverse-on-surface": "#eaf1ff", "on-primary": "#ffffff", "outline-variant": "#c4c6d3", "surface": "#f8f9ff", "surface-card": "#FFFFFF", "secondary-container": "#fcc019", "primary-fixed": "dae2ff", "tertiary-fixed": "#e4dfff", "secondary-fixed-dim": "#f9bd14", "surface-container-low": "#eff4ff", "text-ink": "#1B2430", "primary-container": "#0b3d91", "on-primary-fixed": "#001947", "status-error-text": "#B42318", "status-warning-text": "#9A3412", "outline": "#747783", "on-secondary-container": "#6c5000", "status-uncertain-text": "#4B3FA3", "on-secondary-fixed": "#251a00", "text-muted": "#5A6472", "on-surface": "#131c28", "secondary-fixed": "#ffdf9d", "background-paper": "#F6F4EF", "error-container": "#ffdad6", "surface-tint": "#345baf", "status-success-container": "#E5F2EA", "tertiary-fixed-dim": "#c7bfff", "surface-container-high": "#e0e9f9", "status-warning-container": "#FFEDD5", "primary-hover": "#08306F", "surface-dim": "#d1daeb", "surface-variant": "#dae3f4", "primary": "#002869", "background": "#f8f9ff", "tertiary": "#27157f", "surface-bright": "#f8f9ff", "primary-fixed-dim": "#b1c5ff", "tertiary-container": "#3e3196", "on-background": "#131c28" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-2xl": "2rem", "margin-desktop": "2rem", "gutter": "1rem", "space-xs": "0.25rem", "space-md": "0.75rem", "gutter-desktop": "1.5rem", "space-xl": "1.5rem", "margin": "1rem", "space-lg": "1rem" }, "fontFamily": { "km-display": ["Public Sans"], "headline-lg": ["Public Sans"], "headline-sm": ["Public Sans"], "body-md": ["Public Sans"], "body-sm": ["Public Sans"], "label-md": ["Public Sans"], "data-tabular": ["Public Sans"], "caption": ["Public Sans"] }, "fontSize": { "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }] } } } };</script></head><body class="bg-background-paper font-body-md text-body-md text-text-ink flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-background-paper/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Volver" class="flex items-center gap-space-xs text-text-ink hover:text-primary min-w-[44px] min-h-[44px] -ml-space-xs" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span><span class="font-label-md text-label-md">Volver</span></button><h1 class="font-headline-sm text-headline-sm text-text-ink text-center flex-1 pr-11">Registrar trabajo</h1></div></header><main class="flex flex-col relative w-full px-margin pt-14 pb-safe bg-background-paper flex-1"><div class="flex flex-col w-full pb-safe max-w-[720px] mx-auto">
<div class="flex flex-col gap-space-lg py-space-md">
<!-- Selector de dos opciones (Segmented Control) -->
<div aria-label="Tipo de trabajo" class="p-1 bg-surface-container rounded-[12px] flex items-center gap-1" role="tablist">
<button aria-selected="true" class="flex-1 h-10 flex items-center justify-center rounded-[8px] bg-surface-card text-text-ink font-label-md text-label-md shadow-[0_1px_3px_rgba(27,36,48,0.06)] transition-all" id="tab-plan" onclick="selectTab('plan')" role="tab" type="button">
        Del plan
      </button>
<button aria-selected="false" class="flex-1 h-10 flex items-center justify-center rounded-[8px] text-text-muted hover:text-text-ink font-label-md text-label-md transition-all" id="tab-otro" onclick="selectTab('otro')" role="tab" type="button">
        Otro trabajo
      </button>
</div>
<!-- Formulario estructurado -->
<form class="flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<!-- 2. Campo desplegable: Trabajo -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="campo-trabajo">
          Trabajo
        </label>
<div class="relative flex items-center">
<select class="w-full h-12 bg-surface-card text-text-ink font-body-md text-body-md px-3 pr-10 rounded-[10px] appearance-none focus:outline-none focus:ring-2 focus:ring-primary-container cursor-pointer shadow-sm" id="campo-trabajo">
<option selected="" value="aceite">Aceite y filtro de aceite</option>
<option value="aire">Filtro de aire</option>
<option value="bujias">Bujías de encendido</option>
<option value="frenos">Pastillas de freno delanteras</option>
</select>
<span class="material-symbols-outlined text-text-muted absolute right-3 pointer-events-none select-none text-[20px]">
            expand_more
          </span>
</div>
</div>
<!-- 3. Campo de fecha: Fecha -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="campo-fecha">
          Fecha
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-card text-text-ink font-data-tabular text-data-tabular tabular-nums px-3 pr-10 rounded-[10px] focus:outline-none focus:ring-2 focus:ring-primary-container shadow-sm" id="campo-fecha" type="text" value="10/10/2026">
<span class="material-symbols-outlined text-text-muted absolute right-3 pointer-events-none select-none text-[20px]">
            calendar_today
          </span>
</div>
</div>
<!-- 4. Campo: Kilometraje -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="campo-km">
          Kilometraje
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-card text-text-ink font-data-tabular text-data-tabular tabular-nums pl-3 pr-12 rounded-[10px] focus:outline-none focus:ring-2 focus:ring-primary-container shadow-sm" id="campo-km" type="text" value="62.400">
<span class="absolute right-3 font-data-tabular text-data-tabular text-text-muted select-none pointer-events-none">
            km
          </span>
</div>
</div>
<!-- 5. Campo: Taller -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-ink" for="campo-taller">
            Taller
          </label>
<span class="font-caption text-caption text-text-muted">
            Opcional
          </span>
</div>
<input class="w-full h-12 bg-surface-card text-text-ink font-body-md text-body-md px-3 rounded-[10px] focus:outline-none focus:ring-2 focus:ring-primary-container shadow-sm" id="campo-taller" placeholder="Nombre del taller o mecánico" type="text" value="Lubricentro San Martín">
</div>
<!-- 6. Campo: Costo -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-ink" for="campo-costo">
            Costo
          </label>
<span class="font-caption text-caption text-text-muted">
            Opcional
          </span>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 font-data-tabular text-data-tabular text-text-muted select-none pointer-events-none">
            $
          </span>
<input class="w-full h-12 bg-surface-card text-text-ink font-data-tabular text-data-tabular tabular-nums pl-7 pr-3 rounded-[10px] focus:outline-none focus:ring-2 focus:ring-primary-container shadow-sm" id="campo-costo" type="text" value="85.000">
</div>
</div>
<!-- 7. Bloque: Comprobante -->
<div class="flex flex-col gap-space-xs">
<span class="font-label-md text-label-md text-text-ink">
          Comprobante
        </span>
<div class="flex items-center justify-between bg-surface-card rounded-[10px] p-2 pr-3 transition-opacity shadow-sm" id="bloque-comprobante">
<div class="flex items-center gap-space-md min-w-0 pr-2">
<!-- Miniatura sutil y neutra -->
<div class="w-11 h-11 bg-surface-container rounded-[6px] flex items-center justify-center flex-shrink-0 text-text-muted">
<span class="material-symbols-outlined text-[22px]">image</span>
</div>
<!-- Datos del archivo -->
<div class="flex items-center gap-1.5 min-w-0"><span class="font-body-sm text-body-sm text-text-ink truncate font-medium">factura.jpg</span><span class="text-text-muted select-none">·</span><span class="font-caption text-caption text-text-muted tabular-nums flex-shrink-0">1,2 MB</span></div>
</div>
<!-- Acción Quitar -->
<button class="font-label-md text-label-md text-primary-container hover:text-primary-hover underline underline-offset-2 flex-shrink-0 py-1 px-1" onclick="quitarComprobante()" type="button">
            Quitar
          </button>
</div>
<!-- Estado vacío alternativo cuando se quita el archivo -->
<button class="hidden w-full h-12 bg-surface-card rounded-[10px] flex items-center justify-center gap-space-xs text-text-muted hover:text-text-ink transition-colors shadow-sm" id="btn-adjuntar" onclick="restaurarComprobante()" type="button">
<span class="material-symbols-outlined text-[20px]">attach_file</span>
<span class="font-label-md text-label-md">Adjuntar comprobante</span>
</button>
</div>
<!-- 8. Botón principal al pie a lo ancho -->
<div class="pt-space-md">
<button class="w-full h-12 bg-primary-container hover:bg-primary-hover active:bg-primary text-on-primary rounded-[10px] font-label-md text-label-md flex items-center justify-center transition-colors" type="submit">
          Guardar trabajo
        </button>
</div>
</form>
</div>
</div>
<script>
  function selectTab(type) {
    const tabPlan = document.getElementById('tab-plan');
    const tabOtro = document.getElementById('tab-otro');

    if (type === 'plan') {
      tabPlan.setAttribute('aria-selected', 'true');
      tabPlan.className = 'flex-1 h-10 flex items-center justify-center rounded-[8px] bg-surface-card text-text-ink font-label-md text-label-md shadow-[0_1px_3px_rgba(27,36,48,0.06)] transition-all';
      
      tabOtro.setAttribute('aria-selected', 'false');
      tabOtro.className = 'flex-1 h-10 flex items-center justify-center rounded-[8px] text-text-muted hover:text-text-ink font-label-md text-label-md transition-all';
    } else {
      tabOtro.setAttribute('aria-selected', 'true');
      tabOtro.className = 'flex-1 h-10 flex items-center justify-center rounded-[8px] bg-surface-card text-text-ink font-label-md text-label-md shadow-[0_1px_3px_rgba(27,36,48,0.06)] transition-all';
      
      tabPlan.setAttribute('aria-selected', 'false');
      tabPlan.className = 'flex-1 h-10 flex items-center justify-center rounded-[8px] text-text-muted hover:text-text-ink font-label-md text-label-md transition-all';
    }
  }

  function quitarComprobante() {
    const contenedor = document.getElementById('bloque-comprobante');
    const btnAdjuntar = document.getElementById('btn-adjuntar');
    if (contenedor && btnAdjuntar) {
      contenedor.classList.add('hidden');
      btnAdjuntar.classList.remove('hidden');
    }
  }

  function restaurarComprobante() {
    const contenedor = document.getElementById('bloque-comprobante');
    const btnAdjuntar = document.getElementById('btn-adjuntar');
    if (contenedor && btnAdjuntar) {
      contenedor.classList.remove('hidden');
      btnAdjuntar.classList.add('hidden');
    }
  }
</script></main>

</body></html>
