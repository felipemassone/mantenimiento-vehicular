<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-container": "#ada4ff", "status-error-container": "#FEE4E2", "status-success-text": "#1E6B43", "surface-container-highest": "#dae3f4", "surface-container": "#EFECE5", "on-tertiary-fixed-variant": "#43369b", "on-error": "#ffffff", "secondary": "#785900", "border-outline": "#8A8F98", "on-error-container": "#93000a", "border-divider": "#E3DFD6", "on-secondary-fixed-variant": "#5b4300", "on-primary-fixed-variant": "#144296", "on-tertiary-fixed": "#170065", "inverse-primary": "#b1c5ff", "status-uncertain-container": "#EDEBFA", "error": "#ba1a1a", "surface-container-lowest": "#ffffff", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "on-surface-variant": "#434652", "on-primary-container": "#8dadff", "inverse-surface": "#28313d", "status-uncertain-border": "#8C82D6", "inverse-on-surface": "#eaf1ff", "on-primary": "#ffffff", "outline-variant": "#c4c6d3", "surface": "#f8f9ff", "surface-card": "#FFFFFF", "secondary-container": "#fcc019", "primary-fixed": "dae2ff", "tertiary-fixed": "#e4dfff", "secondary-fixed-dim": "#f9bd14", "surface-container-low": "#eff4ff", "text-ink": "#1B2430", "primary-container": "#0b3d91", "on-primary-fixed": "#001947", "status-error-text": "#B42318", "status-warning-text": "#9A3412", "outline": "#747783", "on-secondary-container": "#6c5000", "status-uncertain-text": "#4B3FA3", "on-secondary-fixed": "#251a00", "text-muted": "#5A6472", "on-surface": "#131c28", "secondary-fixed": "#ffdf9d", "background-paper": "#F6F4EF", "error-container": "#ffdad6", "surface-tint": "#345baf", "status-success-container": "#E5F2EA", "tertiary-fixed-dim": "#c7bfff", "surface-container-high": "#e0e9f9", "status-warning-container": "#FFEDD5", "primary-hover": "#08306F", "surface-dim": "#d1daeb", "surface-variant": "#dae3f4", "primary": "#002869", "background": "#f8f9ff", "tertiary": "#27157f", "surface-bright": "#f8f9ff", "primary-fixed-dim": "#b1c5ff", "tertiary-container": "#3e3196", "on-background": "#131c28" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-2xl": "2rem", "margin-desktop": "2rem", "gutter": "1rem", "space-xs": "0.25rem", "space-md": "0.75rem", "gutter-desktop": "1.5rem", "space-xl": "1.5rem", "margin": "1rem", "space-lg": "1rem" }, "fontFamily": { "km-display": ["Public Sans"], "headline-lg": ["Public Sans"], "headline-sm": ["Public Sans"], "body-md": ["Public Sans"], "body-sm": ["Public Sans"], "label-md": ["Public Sans"], "data-tabular": ["Public Sans"], "caption": ["Public Sans"] }, "fontSize": { "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }] } } } };</script></head><body class="bg-background-paper font-body-md text-body-md text-text-ink flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-background-paper/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Volver" class="flex items-center gap-space-xs text-text-ink hover:text-primary min-w-[44px] min-h-[44px] -ml-space-xs" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span><span class="font-label-md text-label-md">Volver</span></button><h1 class="font-headline-sm text-headline-sm text-text-ink text-center flex-1 pr-11">Registrar trabajo</h1></div></header><main class="flex flex-col relative w-full px-margin pt-14 pb-safe bg-background-paper flex-1"><div class="flex flex-col w-full pb-space-2xl">
<!-- Segmented Control -->
<div class="w-full bg-surface-container p-1 rounded-[10px] flex items-center mb-space-xl">
<button class="flex-1 h-9 rounded-lg flex items-center justify-center font-label-md text-label-md text-text-muted hover:text-text-ink transition-colors" type="button">
      Del plan
    </button>
<button class="flex-1 h-9 rounded-lg bg-surface-card flex items-center justify-center font-label-md text-label-md text-text-ink shadow-[0_1px_3px_rgba(27,36,48,0.06)] font-semibold" type="button">
      Otro trabajo
    </button>
</div>
<form class="flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<!-- Campo: Descripción -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="descripcion">
        Descripción
      </label>
<div class="relative flex items-center">
<input class="w-full h-12 px-3 bg-surface-card text-text-ink rounded-[10px] border border-border-outline font-body-md text-body-md focus:outline-none focus:border-2 focus:border-primary-container" id="descripcion" type="text" value="Cambio de escobillas">
</div>
</div>
<!-- Campo: Fecha (con error) -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="fecha">
        Fecha
      </label>
<div class="relative flex items-center">
<input aria-describedby="error-fecha" aria-invalid="true" class="w-full h-12 pl-3 pr-11 bg-surface-card text-text-ink rounded-[10px] border-[1.5px] border-error font-body-md text-body-md [font-variant-numeric:tabular-nums] focus:outline-none focus:border-error" id="fecha" type="text" value="20/10/2026">
<div class="absolute right-3 flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
</div>
</div>
<div class="flex items-center gap-1 mt-0.5 text-error" id="error-fecha">
<span class="material-symbols-outlined text-[16px] leading-none shrink-0">error</span>
<span class="font-caption text-caption text-error">
          La fecha no puede ser posterior a hoy.
        </span>
</div>
</div>
<!-- Campo: Kilometraje (con error) -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="kilometraje">
        Kilometraje
      </label>
<div class="relative flex items-center">
<input aria-describedby="error-kilometraje" aria-invalid="true" class="w-full h-12 pl-3 pr-11 bg-surface-card text-text-ink rounded-[10px] border-[1.5px] border-error font-body-md text-body-md [font-variant-numeric:tabular-nums] focus:outline-none focus:border-error" id="kilometraje" inputmode="numeric" placeholder="" type="text">
<span class="absolute right-3 font-body-md text-body-md text-text-muted pointer-events-none">
          km
        </span>
</div>
<div class="flex items-center gap-1 mt-0.5 text-error" id="error-kilometraje">
<span class="material-symbols-outlined text-[16px] leading-none shrink-0">error</span>
<span class="font-caption text-caption text-error">
          Ingresá el kilometraje.
        </span>
</div>
</div>
<!-- Campo: Taller (Opcional) -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-ink" for="taller">
          Taller
        </label>
<span class="font-caption text-caption text-text-muted">
          Opcional
        </span>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 px-3 bg-surface-card text-text-ink rounded-[10px] border border-border-outline font-body-md text-body-md focus:outline-none focus:border-2 focus:border-primary-container" id="taller" placeholder="" type="text">
</div>
</div>
<!-- Campo: Costo (Opcional) -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-ink" for="costo">
          Costo
        </label>
<span class="font-caption text-caption text-text-muted">
          Opcional
        </span>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 font-body-md text-body-md text-text-muted pointer-events-none select-none">
          $
        </span>
<input class="w-full h-12 pl-8 pr-3 bg-surface-card text-text-ink rounded-[10px] border border-border-outline font-body-md text-body-md [font-variant-numeric:tabular-nums] focus:outline-none focus:border-2 focus:border-primary-container" id="costo" inputmode="numeric" placeholder="" type="text">
</div>
</div>
<!-- Bloque de Comprobante -->
<div class="flex flex-col gap-space-xs pt-1">
<button class="w-full h-12 bg-surface-card border border-border-outline rounded-[10px] text-text-ink font-label-md text-label-md flex items-center justify-center gap-space-sm active:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px] text-text-ink">attach_file</span>
<span class="">Adjuntar comprobante</span>
</button>
<span class="font-caption text-caption text-text-muted text-center">
        JPG o PNG, hasta 5 MB.
      </span>
</div>
<!-- Botón Principal -->
<div class="pt-space-md">
<button class="w-full h-12 bg-primary-container hover:bg-primary-hover active:bg-primary-hover text-surface-container-lowest font-label-md text-label-md rounded-[10px] flex items-center justify-center transition-colors" type="submit">
        Guardar trabajo
      </button>
</div>
</form>
</div></main>

</body></html>
