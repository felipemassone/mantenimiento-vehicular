<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "text-ink": "#1B2430", "secondary": "#785900", "on-tertiary": "#ffffff", "on-secondary": "#ffffff", "status-warning-container": "#FFEDD5", "primary-fixed": "#dae2ff", "on-surface": "#131c28", "on-tertiary-fixed-variant": "#43369b", "text-muted": "#5A6472", "surface-tint": "#345baf", "status-uncertain-border": "#8C82D6", "background-paper": "#F6F4EF", "on-error-container": "#93000a", "status-uncertain-text": "#4B3FA3", "outline-variant": "#c4c6d3", "inverse-primary": "#b1c5ff", "on-primary": "#ffffff", "surface-variant": "#dae3f4", "surface-container-low": "#eff4ff", "on-secondary-container": "#6c5000", "status-success-text": "#1E6B43", "error": "#ba1a1a", "primary-fixed-dim": "#b1c5ff", "secondary-fixed-dim": "#f9bd14", "surface-bright": "#f8f9ff", "on-tertiary-fixed": "#170065", "status-success-container": "#E5F2EA", "inverse-surface": "#28313d", "tertiary": "#27157f", "surface-dim": "#d1daeb", "border-divider": "#E3DFD6", "on-secondary-fixed": "#251a00", "tertiary-container": "#3e3196", "on-primary-fixed-variant": "#144296", "primary": "#002869", "on-surface-variant": "#434652", "on-primary-fixed": "#001947", "on-tertiary-container": "#ada4ff", "surface-container-highest": "#dae3f4", "status-uncertain-container": "#EDEBFA", "surface-container": "#EFECE5", "surface": "#f8f9ff", "on-secondary-fixed-variant": "#5b4300", "secondary-fixed": "#ffdf9d", "status-error-text": "#B42318", "primary-container": "#E3EAF6", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#c7bfff", "outline": "#747783", "tertiary-fixed": "#e4dfff", "on-error": "#ffffff", "border-outline": "#8A8F98", "secondary-container": "#fcc019", "inverse-on-surface": "#eaf1ff", "error-container": "#ffdad6", "on-bac  min-h-screen flex flex-col relative"><header class="fixed top-0 max-w-[720px] w-full z-50 bg-background-paper/95 backdrop-blur-xl border-b border-border-divider pt-safe"><div class="h-14 px-space-md flex items-center justify-between"><button aria-label="Volver" class="min-h-[44px] min-w-[44px] -ml-space-xs flex items-center gap-space-xs px-space-xs py-space-xs rounded text-text-ink hover:text-text-muted transition-colors" onclick="history.back()" type="button"><span aria-hidden="true" class="material-symbols-outlined text-[20px]">arrow_back</span><span class="font-label-md text-label-md">Volver</span></button></div></header><main class="flex-1 flex flex-col w-full px-margin pt-14 pb-safe bg-background-paper"><div class="flex flex-col w-full pb-safe">
<!-- Stepper Indicator -->
<div class="flex flex-col gap-space-xs mb-space-lg">
<span class="font-caption text-caption text-text-muted">Paso 1 de 3 · Tu auto</span>
<div aria-hidden="true" class="flex w-full gap-space-xs">
<div class="h-1 flex-1 rounded-full bg-[#0B3D91]"></div>
<div class="h-1 flex-1 rounded-full bg-border-divider"></div>
<div class="h-1 flex-1 rounded-full bg-border-divider"></div>
</div>
</div>
<!-- Page Title -->
<h2 class="font-headline-lg text-headline-lg text-text-ink text-left mb-space-lg">
    Tu auto
  </h2>
<!-- Out of Catalog Callout / Inline Alert -->
<aside class="flex items-start gap-space-md p-[13px] rounded-[10px] bg-status-warning-container border border-[#FDBA74] mb-space-xl" role="status">
<span class="material-symbols-outlined text-[20px] text-status-warning-text shrink-0 select-none mt-[2px]">
      info
    </span>
<p class="font-body-sm text-body-sm text-status-warning-text leading-[20px] m-0">
      Vamos a guardar tu vehículo, pero todavía no tenemos el plan de mantenimiento de este modelo. Vas a poder registrar los trabajos que le hagas.
    </p>
</aside>
<!-- Vehicle Entry Form -->
<form class="flex flex-col gap-space-lg w-full" onsubmit="event.preventDefault();">
<!-- Brand Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="car-brand">
        Marca
      </label>
<input autocomplete="off" class="h-12 w-full px-space-md rounded-[10px] bg-surface-card border border-border-outline text-text-ink font-body-md text-body-md focus:outline-none focus:border-2 focus:border-[#0B3D91] transition-colors" id="car-brand" type="text" value="Peugeot">
</div>
<!-- Model Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="car-model">
        Modelo
      </label>
<input autocomplete="off" class="h-12 w-full px-space-md rounded-[10px] bg-surface-card border border-border-outline text-text-ink font-body-md text-body-md focus:outline-none focus:border-2 focus:border-[#0B3D91] transition-colors" id="car-model" type="text" value="208">
</div>
<!-- Year Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="car-year">
        Año
      </label>
<input autocomplete="off" class="h-12 w-full px-space-md rounded-[10px] bg-surface-card border border-border-outline text-text-ink font-body-md text-body-md focus:outline-none focus:border-2 focus:border-[#0B3D91] transition-colors" id="car-year" inputmode="numeric" type="text" value="2019">
</div>
<!-- Mileage Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="car-mileage">
        Kilometraje actual
      </label>
<div class="relative w-full flex items-center">
<input autocomplete="off" class="h-12 w-full pl-space-md pr-12 rounded-[10px] bg-surface-card border border-border-outline text-text-ink font-data-tabular text-data-tabular focus:outline-none focus:border-2 focus:border-[#0B3D91] transition-colors" id="car-mileage" inputmode="numeric" style="font-feature-settings: 'tnum';" type="text" value="41.000">
<span class="absolute right-space-md pointer-events-none font-body-sm text-body-sm text-text-muted select-none">
          km
        </span>
</div>
<p class="font-caption text-caption text-text-muted mt-space-xs">
        El que marca el tablero hoy. Con el número aproximado alcanza.
      </p>
</div>
<!-- Secondary Link to Catalog Selector -->
<div class="pt-space-xs">
<a class="inline-flex items-center text-[14px] leading-[20px] font-medium text-[#0B3D91] hover:underline focus:outline-none underline" href="#">
        Elegir un modelo de la lista
      </a>
</div>
<!-- Primary Action Button -->
<div class="pt-space-xl">
<button class="w-full h-12 rounded-[10px] bg-[#0B3D91] text-on-primary font-label-md text-label-md flex items-center justify-center hover:bg-primary-hover active:bg-[#062454] transition-colors focus:outline-none" type="submit">
        Seguir
      </button>
</div>
</form>
</div></main></div>
