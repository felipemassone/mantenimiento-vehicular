<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "text-ink": "#1B2430", "secondary": "#785900", "on-tertiary": "#ffffff", "on-secondary": "#ffffff", "status-warning-container": "#FFEDD5", "primary-fixed": "#dae2ff", "on-surface": "#131c28", "on-tertiary-fixed-variant": "#43369b", "text-muted": "#5A6472", "surface-tint": "#345baf", "status-uncertain-border": "#8C82D6", "background-paper": "#F6F4EF", "on-error-container": "#93000a", "status-uncertain-text": "#4B3FA3", "outline-variant": "#c4c6d3", "inverse-primary": "#b1c5ff", "on-primary": "#ffffff", "surface-variant": "#dae3f4", "surface-container-low": "#eff4ff", "on-secondary-container": "#6c5000", "status-success-text": "#1E6B43", "error": "#ba1a1a", "primary-fixed-dim": "#b1c5ff", "secondary-fixed-dim": "#f9bd14", "surface-bright": "#f8f9ff", "on-tertiary-fixed": "#170065", "status-success-container": "#E5F2EA", "inverse-surface": "#28313d", "tertiary": "#27157f", "surface-dim": "#d1daeb", "border-divider": "#E3DFD6", "on-secondary-fixed": "#251a00", "tertiary-container": "#3e3196", "on-primary-fixed-variant": "#144296", "primary": "#002869", "on-surface-variant": "#434652", "on-primary-fixed": "#001947", "on-tertiary-container": "#ada4ff", "surface-container-highest": "#dae3f4", "status-uncertain-container": "#EDEBFA", "surface-container": "#EFECE5", "surface": "#f8f9ff", "on-secondary-fixed-variant": "#5b4300", "secondary-fixed": "#ffdf9d", "status-error-text": "#B42318", "primary-container": "#E3EAF6", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#c7bfff", "outline": "#747783", "tertiary-fixed": "#e4dfff", "on-error": "#ffffff", "border-outline": "#8A8F98", "secondary-container": "#fcc019", "inverse-on-surface": "#eaf1ff", "error-container": "#ffdad6", "on-background": "#131c28", "surface-card": "#FFFFFF", "status-error-container": "#FEE4E2", "status-warning-text": "#9A3412", "background": "#f8f9ff", "primary-hover": "#08306F", "surface-container-high": "#e0e9f9", "on-primary-container": "#8dadff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xs": "0.25rem", "gutter-desktop": "1.5rem", "space-2xl": "2rem", "space-lg": "1rem", "space-xl": "1.5rem", "margin": "1rem", "space-sm": "0.5rem", "space-md": "0.75rem", "gutter": "1rem", "margin-desktop": "2rem" }, fontFamily: { "label-md": ["Public Sans"], "body-md": ["Public Sans"], "data-tabular": ["Public Sans"], "headline-lg": ["Public Sans"], "headline-sm": ["Public Sans"], "body-sm": ["Public Sans"], "caption": ["Public Sans"], "km-display": ["Public Sans"] }, fontSize: { "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;background-color:#F6F4EF;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-background-paper text-text-ink font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-text-ink"><div class="w-full max-w-[720px] mx-auto min-h-screen flex flex-col relative"><header class="fixed top-0 max-w-[720px] w-full z-50 bg-background-paper/95 backdrop-blur-xl border-b border-border-divider pt-safe"><div class="h-14 px-space-md flex items-center justify-between"><button aria-label="Volver" class="min-h-[44px] min-w-[44px] -ml-space-xs flex items-center gap-space-xs px-space-xs py-space-xs rounded text-text-ink hover:text-text-muted transition-colors" onclick="history.back()" type="button"><span aria-hidden="true" class="material-symbols-outlined text-[20px]">arrow_back</span><span class="font-label-md text-label-md">Volver</span></button><h1 class="font-headline-sm text-headline-sm text-text-ink text-center flex-1 truncate px-space-xs">Agregar vehículo</h1></div></header><main class="flex-1 flex flex-col w-full px-margin pt-14 pb-safe bg-background-paper"><div class="flex flex-col w-full pb-space-xl">
<!-- Aviso en línea: Fuera de catálogo -->
<aside aria-live="polite" class="w-full bg-status-warning-container rounded-[10px] p-space-md flex items-start gap-space-sm mb-space-xl" role="status">
<span aria-hidden="true" class="material-symbols-outlined text-[20px] text-status-warning-text shrink-0 mt-[1px]">info</span>
<p class="font-body-sm text-body-sm text-status-warning-text leading-tight">
      Vamos a guardar tu vehículo, pero todavía no tenemos el plan de mantenimiento de este modelo. Vas a poder registrar los trabajos que le hagas.
    </p>
</aside>
<!-- Formulario de carga manual -->
<form class="flex flex-col w-full gap-space-lg" novalidate="" onsubmit="event.preventDefault();">
<!-- Campo: Marca -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-ink" for="input-marca">
        Marca
      </label>
<input class="h-12 w-full bg-surface-card text-text-ink font-body-md text-body-md px-space-md rounded-[10px] outline-none transition-colors" id="input-marca" name="marca" required="" type="text" value="Peugeot" style="border: 1px solid rgb(138, 143, 152);">
</div>
<!-- Campo: Modelo -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-ink" for="input-modelo">
        Modelo
      </label>
<input class="h-12 w-full bg-surface-card text-text-ink font-body-md text-body-md px-space-md rounded-[10px] outline-none transition-colors" id="input-modelo" name="modelo" required="" type="text" value="208" style="border: 1px solid rgb(138, 143, 152);">
</div>
<!-- Campo: Año -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-ink" for="input-anio">
        Año
      </label>
<input class="h-12 w-full bg-surface-card text-text-ink font-data-tabular text-data-tabular px-space-md rounded-[10px] outline-none transition-colors" id="input-anio" inputmode="numeric" maxlength="4" name="anio" required="" style="font-feature-settings: &quot;tnum&quot;; border: 1px solid rgb(138, 143, 152);" type="text" value="2019">
</div>
<!-- Campo: Kilometraje actual -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-text-ink" for="input-km">
        Kilometraje actual
      </label>
<div class="relative w-full flex items-center bg-surface-card rounded-[10px]" style="border: 1px solid rgb(138, 143, 152);">
<input class="h-12 w-full bg-transparent text-text-ink font-data-tabular text-data-tabular pl-space-md pr-12 rounded-[10px] outline-none transition-colors" id="input-km" inputmode="numeric" name="kilometraje" required="" style="font-feature-settings: 'tnum';" type="text" value="41.000">
<span aria-hidden="true" class="absolute right-space-md text-text-muted font-body-sm text-body-sm pointer-events-none select-none">
          km
        </span>
</div>
</div>
<!-- Enlace de regreso al catálogo -->
<div class="pt-space-xs">
<button class="text-primary hover:text-primary-hover font-label-md text-label-md inline-flex items-center text-left py-space-xs focus:outline-none" onclick="history.back()" type="button">
        Elegir un modelo de la lista
      </button>
</div>
<!-- Botón Primario de Acción -->
<div class="pt-space-md">
<button class="w-full h-12 bg-primary hover:bg-primary-hover text-on-primary font-label-md text-label-md rounded-[10px] flex items-center justify-center transition-colors focus:outline-none" type="submit">
        Agregar vehículo
      </button>
</div>
</form>
</div></main></div>

</body></html>
