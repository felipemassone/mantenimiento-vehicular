<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "text-ink": "#1B2430", "secondary": "#785900", "on-tertiary": "#ffffff", "on-secondary": "#ffffff", "status-warning-container": "#FFEDD5", "primary-fixed": "#dae2ff", "on-surface": "#131c28", "on-tertiary-fixed-variant": "#43369b", "text-muted": "#5A6472", "surface-tint": "#345baf", "status-uncertain-border": "#8C82D6", "background-paper": "#F6F4EF", "on-error-container": "#93000a", "status-uncertain-text": "#4B3FA3", "outline-variant": "#c4c6d3", "inverse-primary": "#b1c5ff", "on-primary": "#ffffff", "surface-variant": "#dae3f4", "surface-container-low": "#eff4ff", "on-secondary-container": "#6c5000", "status-success-text": "#1E6B43", "error": "#ba1a1a", "primary-fixed-dim": "#b1c5ff", "secondary-fixed-dim": "#f9bd14", "surface-bright": "#f8f9ff", "on-tertiary-fixed": "#170065", "status-success-container": "#E5F2EA", "inverse-surface": "#28313d", "tertiary": "#27157f", "surface-dim": "#d1daeb", "border-divider": "#E3DFD6", "on-secondary-fixed": "#251a00", "tertiary-container": "#3e3196", "on-primary-fixed-variant": "#144296", "primary": "#002869", "on-surface-variant": "#434652", "on-primary-fixed": "#001947", "on-tertiary-container": "#ada4ff", "surface-container-highest": "#dae3f4", "status-uncertain-container": "#EDEBFA", "surface-container": "#EFECE5", "surface": "#f8f9ff", "on-secondary-fixed-variant": "#5b4300", "secondary-fixed": "#ffdf9d", "status-error-text": "#B42318", "primary-container": "#E3EAF6", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#c7bfff", "outline": "#747783", "tertiary-fixed": "#e4dfff", "on-error": "#ffffff", "border-outline": "#8A8F98", "secondary-container": "#fcc019", "inverse-on-surface": "#eaf1ff", "error-container": "#ffdad6", "on-background": "#131c28", "surface-card": "#FFFFFF", "status-error-container": "#FEE4E2", "status-warning-text": "#9A3412", "background": "#f8f9ff", "primary-hover": "#08306F", "surface-container-high": "#e0e9f9", "on-primary-container": "#8dadff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xs": "0.25rem", "gutter-desktop": "1.5rem", "space-2xl": "2rem", "space-lg": "1rem", "space-xl": "1.5rem", "margin": "1rem", "space-sm": "0.5rem", "space-md": "0.75rem", "gutter": "1rem", "margin-desktop": "2rem" }, fontFamily: { "label-md": ["Public Sans"], "body-md": ["Public Sans"], "data-tabular": ["Public Sans"], "headline-lg": ["Public Sans"], "headline-sm": ["Public Sans"], "body-sm": ["Public Sans"], "caption": ["Public Sans"], "km-display": ["Public Sans"] }, fontSize: { "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;background-color:#F6F4EF;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-background-paper text-text-ink font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-text-ink"><div class="w-full max-w-[720px] mx-auto min-h-screen flex flex-col relative"><header class="fixed top-0 max-w-[720px] w-full z-50 bg-background-paper/95 backdrop-blur-xl border-b border-border-divider pt-safe"><div class="h-14 px-space-md flex items-center justify-between"><button aria-label="Volver" class="min-h-[44px] min-w-[44px] -ml-space-xs flex items-center gap-space-xs px-space-xs py-space-xs rounded text-text-ink hover:text-text-muted transition-colors" onclick="history.back()" type="button"><span aria-hidden="true" class="material-symbols-outlined text-[20px]">arrow_back</span><span class="font-label-md text-label-md">Volver</span></button><h1 class="font-headline-sm text-headline-sm text-text-ink text-center flex-1 truncate px-space-xs">Agregar vehículo</h1></div></header><main class="flex-1 flex flex-col w-full px-margin pt-14 pb-safe bg-background-paper"><div class="flex flex-col w-full pb-space-2xl">
<!-- Status Badge / Context Indicator -->

<!-- Form Structure -->
<form class="flex flex-col gap-space-lg" id="vehicle-form" onsubmit="event.preventDefault();">
<!-- Field 1: Marca -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-ink mb-[6px]" for="select-brand">
        Marca
      </label>
<div class="relative w-full">
<select class="w-full h-[48px] px-space-md pr-10 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] appearance-none focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer border border-border-outline" id="select-brand">
<option selected="" value="Ford">Ford</option>
<option value="Chevrolet">Chevrolet</option>
<option value="Fiat">Fiat</option>
<option value="Peugeot">Peugeot</option>
<option value="Renault">Renault</option>
<option value="Toyota">Toyota</option>
<option value="Volkswagen">Volkswagen</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-space-md text-text-muted">
<span class="material-symbols-outlined text-[20px]">keyboard_arrow_down</span>
</div>
</div>
</div>
<!-- Field 2: Modelo -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-ink mb-[6px]" for="select-model">
        Modelo
      </label>
<div class="relative w-full">
<select class="w-full h-[48px] px-space-md pr-10 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] appearance-none focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer border border-border-outline" id="select-model">
<option selected="" value="Ka">Ka</option>
<option value="Fiesta">Fiesta</option>
<option value="Focus">Focus</option>
<option value="EcoSport">EcoSport</option>
<option value="Ranger">Ranger</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-space-md text-text-muted">
<span class="material-symbols-outlined text-[20px]">keyboard_arrow_down</span>
</div>
</div>
</div>
<!-- Field 3: Año -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-ink mb-[6px]" for="select-year">
        Año
      </label>
<div class="relative w-full">
<select class="w-full h-[48px] px-space-md pr-10 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] appearance-none focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer border border-border-outline" id="select-year">
<option value="2016">2016</option>
<option value="2015">2015</option>
<option selected="" value="2014">2014</option>
<option value="2013">2013</option>
<option value="2012">2012</option>
<option value="2011">2011</option>
<option value="2010">2010</option>
<option value="2009">2009</option>
<option value="2008">2008</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-space-md text-text-muted">
<span class="material-symbols-outlined text-[20px]">keyboard_arrow_down</span>
</div>
</div>
<p class="font-caption text-caption text-text-muted mt-[4px]">
        Este modelo está cargado de 2008 a 2016.
      </p>
</div>
<!-- Field 4: Kilometraje actual -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-ink mb-[6px]" for="input-mileage">
        Kilometraje actual
      </label>
<div class="relative flex items-center w-full">
<input class="w-full h-[48px] pl-space-md pr-12 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] focus:outline-none focus:ring-2 focus:ring-primary [font-feature-settings:'tnum'] border border-border-outline" id="input-mileage" inputmode="numeric" type="text" value="62.400">
<div class="absolute right-0 inset-y-0 flex items-center pr-space-md pointer-events-none">
<span class="font-body-md text-body-md text-text-muted select-none">km</span>
</div>
</div>
</div>
<!-- Alternative Path Link -->
<div class="pt-space-xs">
<button class="inline-flex items-center gap-space-xs text-primary font-label-md text-label-md hover:text-primary-hover focus:outline-none transition-colors py-space-xs -ml-space-xs px-space-xs rounded" type="button">
<span class="material-symbols-outlined text-[18px]">build_circle</span>
<span class="">Mi modelo no figura en la lista</span>
</button>
</div>
<!-- Bottom Action Area -->
<div class="pt-space-2xl flex flex-col gap-space-sm">
<button class="w-full h-[48px] bg-primary hover:bg-primary-hover active:bg-primary-hover text-on-primary font-label-md text-label-md rounded-[10px] transition-colors flex items-center justify-center cursor-pointer shadow-none" id="submit-btn" type="submit">
        Agregar vehículo
      </button>

</div>
</form>
</div>
<script>
  (function() {
    const inputMileage = document.getElementById('input-mileage');
    if (inputMileage) {
      inputMileage.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value) {
          e.target.value = new Intl.NumberFormat('es-AR').format(parseInt(value, 10));
        } else {
          e.target.value = '';
        }
      });
    }
  })();
</script></main></div>

</body></html>
