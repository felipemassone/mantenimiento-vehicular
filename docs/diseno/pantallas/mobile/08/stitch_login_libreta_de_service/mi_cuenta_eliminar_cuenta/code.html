aper/90 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(27,36,48,0.04)]"><div class="h-14 px-margin flex items-center justify-between max-w-[720px] mx-auto w-full"><button class="inline-flex items-center gap-space-xs text-text-ink min-h-[44px] min-w-[44px] py-space-xs pr-space-sm -ml-space-xs active:opacity-70 transition-opacity" onclick="history.back()"><span class="material-symbols-outlined text-[20px] text-text-ink">arrow_back_ios_new</span><span class="font-label-md text-label-md text-text-ink">Volver</span></button><h1 class="font-headline-sm text-headline-sm text-text-ink truncate text-center flex-1 px-space-sm">Mi cuenta</h1><div aria-hidden="true" class="min-w-[44px]"></div></div></header><main class="flex flex-col relative w-full px-margin pt-14 pb-safe bg-background-paper max-w-[720px] mx-auto flex-1"><div class="flex flex-col w-full relative">

<div aria-hidden="true" class="w-full flex flex-col gap-space-lg select-none pointer-events-none"><section class="bg-surface-card rounded-[14px] border border-border-divider p-space-lg flex items-center gap-space-md"><div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[24px] text-text-muted">person</span></div><div class="flex flex-col min-w-0"><span class="font-headline-sm text-headline-sm text-text-ink truncate">felipe.massone@gmail.com</span><span class="font-caption text-caption text-text-muted">Propietario</span></div></section><section class="bg-surface-card rounded-[14px] border border-border-divider overflow-hidden flex flex-col"><div class="flex items-center justify-between p-space-lg border-b border-border-divider"><div class="flex items-center gap-space-md"><span class="material-symbols-outlined text-[20px] text-text-muted">swap_horiz</span><span class="font-label-md text-label-md text-text-ink">Cambiar a Administración</span></div><span class="material-symbols-outlined text-[20px] text-text-muted">chevron_right</span></div><div class="flex items-center justify-between p-space-lg border-b border-border-divider"><div class="flex items-center gap-space-md"><span class="material-symbols-outlined text-[20px] text-text-muted">logout</span><span class="font-label-md text-label-md text-text-ink">Cerrar sesión</span></div><span class="material-symbols-outlined text-[20px] text-text-muted">chevron_right</span></div><div class="flex items-center justify-between p-space-lg"><div class="flex items-center gap-space-md"><span class="material-symbols-outlined text-[20px] text-status-error-text">delete</span><span class="font-label-md text-label-md text-status-error-text">Eliminar mi cuenta</span></div><span class="material-symbols-outlined text-[20px] text-text-muted">chevron_right</span></div></section></div>
<!-- Capa semitransparente oscura (Overlay nítido sin desenfoque) -->
<div class="fixed inset-0 z-40 bg-black/45 transition-opacity" id="modal-backdrop" style="background-color: rgba(0, 0, 0, 0.45);"></div>
<!-- Contenedor modal centrado -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-margin pointer-events-none">
<div aria-describedby="dialog-desc" aria-labelledby="dialog-title" aria-modal="true" class="w-full max-w-[360px] bg-surface-card rounded-[14px] border border-border-divider p-space-xl shadow-[0_4px_12px_rgba(27,36,48,0.08)] pointer-events-auto flex flex-col gap-space-lg" role="dialog">
<!-- Cabecera y descripción -->
<div class="flex flex-col gap-space-sm">
<h2 class="font-headline-sm text-headline-sm text-text-ink" id="dialog-title">
          ¿Eliminar tu cuenta?
        </h2>
<p class="font-body-sm text-body-sm text-text-muted" id="dialog-desc">
          Se van a borrar tus 2 vehículos, sus trabajos registrados y los comprobantes. No se puede deshacer.
        </p>
</div>
<!-- Campo de confirmación con contraseña -->
<form class="flex flex-col gap-space-xs" id="delete-form" onsubmit="event.preventDefault();">
<label class="font-label-md text-label-md text-text-ink" for="password-confirm">
          Ingresá tu contraseña para confirmar
        </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 px-space-md bg-surface-card text-text-ink font-body-md text-body-md border border-border-outline rounded-[10px] focus:outline-none focus:border-[2px] focus:border-primary placeholder:text-text-muted" id="password-confirm" name="password" placeholder="••••••••" required="" type="password">
</div>
</form>
<!-- Botones de acción horizontal -->
<div class="flex items-center gap-space-md w-full pt-space-xs">
<button class="flex-1 h-12 bg-surface-card border border-border-outline text-text-ink rounded-[10px] font-label-md text-label-md flex items-center justify-center active:bg-surface-container transition-colors" onclick="history.back()" type="button">
          Cancelar
        </button>
<button class="flex-1 h-12 bg-status-error-text text-on-error rounded-[10px] font-label-md text-label-md flex items-center justify-center active:opacity-90 transition-opacity" form="delete-form" type="submit">
          Eliminar cuenta
        </button>
</div>
</div>
</div>
</div>
<script>
  // Manejo de teclado para accesibilidad (Escape para cancelar)
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.history.back();
    }
  });

  // Foco automático accesible al campo de contraseña
  setTimeout(function() {
    var input = document.getElementById('password-confirm');
    if (input) {
      input.focus();
    }
  }, 100);
</script></main>
