<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

ary-fixed-dim": "#c7bfff", "on-tertiary": "#ffffff", "status-success-container": "#E5F2EA", "on-secondary-container": "#6c5000", "surface": "#f8f9ff", "status-uncertain-text": "#4B3FA3", "status-error-text": "#B42318", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "1.5rem", "margin-desktop": "2rem", "gutter-desktop": "1.5rem", "gutter": "1rem", "space-2xl": "2rem", "space-sm": "0.5rem", "space-md": "0.75rem", "space-xs": "0.25rem", "margin": "1rem", "space-lg": "1rem" }, fontFamily: { "body-sm": ["Public Sans"], "data-tabular": ["Public Sans"], "km-display": ["Public Sans"], "body-md": ["Public Sans"], "headline-sm": ["Public Sans"], "caption": ["Public Sans"], "headline-lg": ["Public Sans"], "label-md": ["Public Sans"] }, fontSize: { "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{background-color:#F6F4EF;color:#1B2430;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-background-paper font-body-md text-text-ink flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col w-full max-w-[720px] mx-auto px-margin py-margin bg-background-paper"><div class="flex flex-col w-full">
<div class="flex items-center gap-space-sm">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center shrink-0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></div>
<span class="font-headline-sm text-headline-sm text-text-ink tracking-tight">Libreta de service</span>
</div>
<h1 class="mt-8 mb-6 font-headline-lg text-headline-lg text-text-ink text-left">Ingresar</h1>
<form class="flex flex-col w-full" onsubmit="event.preventDefault();">
<div class="flex flex-col mb-4">
<label class="mb-[6px] font-label-md text-label-md text-text-ink" for="email">
        Correo electrónico
      </label>
<input autocomplete="email" class="w-full h-12 px-3 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] border border-border-outline focus:outline-none focus:border-2 focus:border-primary-container transition-colors" id="email" name="email" required="" type="email" value="propietario@example.com">
</div>
<div class="flex flex-col">
<label class="mb-[6px] font-label-md text-label-md text-text-ink" for="password">
        Contraseña
      </label>
<div class="relative w-full">
<input autocomplete="current-password" class="w-full h-12 pl-3 pr-11 bg-surface-card text-text-ink font-body-md text-body-md rounded-[10px] border border-border-outline focus:outline-none focus:border-2 focus:border-primary-container transition-colors" id="password" name="password" required="" type="password" value="ContraseñaSegura123">
<button aria-label="Mostrar u ocultar contraseña" class="absolute inset-y-0 right-0 flex items-center justify-center w-11 text-text-muted hover:text-text-ink focus:outline-none transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end mt-2 mb-7">
<a class="font-label-md text-label-md text-primary-container hover:underline transition-all" href="#">
        Olvidé mi contraseña
      </a>
</div>
<button class="w-full h-12 bg-primary-container hover:bg-primary-hover active:bg-primary text-on-primary font-label-md text-label-md rounded-[10px] transition-colors flex items-center justify-center cursor-pointer" type="submit">
      Ingresar
    </button>
</form>
<div class="flex items-center justify-center gap-1.5 mt-6 font-body-sm text-body-sm text-center">
<span class="text-text-muted">¿No tenés cuenta?</span>
<a class="font-label-md text-label-md text-primary-container hover:underline transition-all" href="#">
      Crear cuenta
    </a>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('passwordIcon');

    if (toggleBtn && pwdInput && icon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>

</body></html>
