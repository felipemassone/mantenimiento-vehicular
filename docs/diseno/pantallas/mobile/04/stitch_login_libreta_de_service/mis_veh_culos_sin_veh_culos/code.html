<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#F6F4EF;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#ffffff", "status-error-text": "#B42318", "primary": "#002869", "status-uncertain-border": "#8C82D6", "secondary": "#785900", "on-secondary-fixed-variant": "#5b4300", "surface-container": "#EFECE5", "status-success-container": "#E5F2EA", "primary-hover": "#08306F", "status-warning-text": "#9A3412", "on-surface-variant": "#434652", "tertiary": "#27157f", "text-muted": "#5A6472", "secondary-fixed": "#ffdf9d", "surface-container-highest": "#dae3f4", "surface": "#f8f9ff", "primary-container": "#E3EAF6", "on-tertiary-container": "#ada4ff", "surface-container-lowest": "#ffffff", "on-tertiary-fixed-variant": "#43369b", "tertiary-container": "#3e3196", "secondary-fixed-dim": "#f9bd14", "outline": "#747783", "status-warning-container": "#FFEDD5", "border-outline": "#8A8F98", "on-surface": "#131c28", "status-uncertain-text": "#4B3FA3", "background-paper": "#F6F4EF", "secondary-container": "#fcc019", "on-error-container": "#93000a", "status-success-text": "#1E6B43", "error-container": "#ffdad6", "on-secondary-fixed": "#251a00", "on-tertiary-fixed": "#170065", "inverse-on-surface": "#eaf1ff", "surface-container-low": "#eff4ff", "tertiary-fixed-dim": "#c7bfff", "on-error": "#ffffff", "surface-variant": "#dae3f4", "status-error-container": "#FEE4E2", "on-background": "#131c28", "surface-dim": "#d1daeb", "surface-bright": "#f8f9ff", "on-primary-fixed": "#001947", "surface-container-high": "#e0e9f9", "tertiary-fixed": "#e4dfff", "on-secondary-container": "#6c5000", "inverse-primary": "#b1c5ff", "surface-card": "#FFFFFF", "on-primary-fixed-variant": "#144296", "on-primary": "#ffffff", "outline-variant": "#c4c6d3", "background": "#f8f9ff", "border-divider": "#E3DFD6", "text-ink": "#1B2430", "error": "#ba1a1a", "on-primary-container": "#8dadff", "primary-fixed": "#dae2ff", "status-uncertain-container": "#EDEBFA", "on-secondary": "#ffffff", "inverse-surface": "#28313d", "surface-tint": "#345baf", "primary-fixed-dim": "#b1c5ff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "space-lg": "1rem", "space-xl": "1.5rem", "gutter": "1rem", "space-sm": "0.5rem", "space-md": "0.75rem", "margin": "1rem", "margin-desktop": "2rem", "space-2xl": "2rem", "gutter-desktop": "1.5rem" }, "fontFamily": { "body-sm": ["Public Sans"], "headline-sm": ["Public Sans"], "label-md": ["Public Sans"], "headline-lg": ["Public Sans"], "data-tabular": ["Public Sans"], "km-display": ["Public Sans"], "body-md": ["Public Sans"], "caption": ["Public Sans"] }, "fontSize": { "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }] } } } }</script></head><body class="bg-background-paper font-body-md text-text-ink antialiased min-h-screen flex flex-col items-center"><div class="w-full max-w-[720px] min-h-screen flex flex-col relative"><header class="fixed top-0 max-w-[720px] w-full z-50 bg-background-paper/95 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><div class="w-9 h-9 rounded-lg bg-[#0B3D91] flex items-center justify-center shrink-0"><svg aria-hidden="true" class="w-5 h-5 text-[#F2B705]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></div><h1 class="font-headline-sm text-headline-sm text-text-ink truncate tracking-tight">Mis vehículos</h1></div><div class="flex items-center"><div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-text-ink font-label-md text-label-md">FM</div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-background-paper"><div class="flex flex-col w-full">
<!-- Cabecera de contexto local -->

<!-- Separador editorial tenue -->

<!-- Estado vacío estricto y sobrio según manual DESIGN.md -->
<section aria-labelledby="empty-state-title" class="flex flex-col items-start w-full max-w-lg text-left pt-space-md pb-space-2xl">
<div class="space-y-space-sm mb-space-2xl">
<h2 class="font-headline-sm text-headline-sm text-text-ink" id="empty-state-title">
        Todavía no cargaste ningún vehículo.
      </h2>
<p class="font-body-md text-body-md text-text-muted">
        Cargá tu auto y te decimos qué mantenimiento le toca.
      </p>
</div>
<!-- Botón de acción principal a ancho completo o contenedor -->
<button class="w-full h-12 bg-primary hover:bg-primary-hover active:bg-primary text-on-primary font-label-md text-label-md rounded-[10px] flex items-center justify-center gap-space-sm transition-colors cursor-pointer focus:outline-none" id="btn-add-vehicle" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">add</span>
<span class="">Agregar vehículo</span>
</button>
</section>
<!-- Diálogo modal austero para registrar nuevo vehículo -->
<div aria-hidden="true" aria-labelledby="modal-title" aria-modal="true" class="fixed inset-0 z-50 flex items-center justify-center px-margin bg-on-surface/40 hidden" id="modal-add-vehicle" role="dialog">
<div class="w-full max-w-[440px] bg-surface-card rounded-[14px] p-space-xl relative" style="box-shadow: 0 4px 12px rgba(27, 36, 48, 0.08);">
<div class="flex items-center justify-between pb-space-md border-b border-border-divider">
<h3 class="font-headline-sm text-headline-sm text-text-ink" id="modal-title">Nuevo vehículo</h3>
<button aria-label="Cerrar ventana" class="w-8 h-8 rounded flex items-center justify-center text-text-muted hover:text-text-ink transition-colors" id="btn-close-modal" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<form class="mt-space-lg space-y-space-lg" id="form-vehicle" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="car-brand">Marca y modelo</label>
<input class="h-12 px-space-md rounded-[10px] bg-surface-card text-text-ink font-body-md text-body-md focus:outline-none focus:bg-surface-card" id="car-brand" placeholder="Ej. Ford Ka 1.5 SE" required="" style="border: 1px solid #8A8F98;" type="text">
</div>
<div class="grid grid-cols-2 gap-space-md">
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="car-year">Año</label>
<input class="h-12 px-space-md rounded-[10px] bg-surface-card text-text-ink font-data-tabular text-data-tabular focus:outline-none" id="car-year" max="2026" min="1950" placeholder="2018" required="" style="border: 1px solid #8A8F98;" type="number">
</div>
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="car-km">Kilómetros actuales</label>
<input class="h-12 px-space-md rounded-[10px] bg-surface-card text-text-ink font-data-tabular text-data-tabular focus:outline-none" id="car-km" placeholder="48.500" required="" style="border: 1px solid #8A8F98;" type="number">
</div>
</div>
<div class="pt-space-md flex flex-col gap-space-sm sm:flex-row-reverse">
<button class="w-full sm:w-auto flex-1 h-12 bg-primary hover:bg-primary-hover text-on-primary font-label-md text-label-md rounded-[10px] transition-colors" type="submit">
            Guardar vehículo
          </button>
<button class="w-full sm:w-auto h-12 px-space-xl bg-surface-card text-text-ink font-label-md text-label-md rounded-[10px] transition-colors" id="btn-cancel-modal" style="border: 1px solid #8A8F98;" type="button">
            Cancelar
          </button>
</div>
</form>
</div>
</div>
</div>
<script>
  (function() {
    const btnAccount = document.getElementById('btn-account-menu');
    const dropdown = document.getElementById('account-dropdown');
    const btnAddVehicle = document.getElementById('btn-add-vehicle');
    const modal = document.getElementById('modal-add-vehicle');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnCancelModal = document.getElementById('btn-cancel-modal');
    const formVehicle = document.getElementById('form-vehicle');

    // Manejo de dropdown de usuario
    if (btnAccount && dropdown) {
      btnAccount.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !dropdown.classList.contains('hidden');
        dropdown.classList.toggle('hidden');
        btnAccount.setAttribute('aria-expanded', String(!isOpen));
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target) && e.target !== btnAccount) {
          dropdown.classList.add('hidden');
          btnAccount.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // Manejo de apertura y cierre de modal
    function openModal() {
      if (modal) {
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
        const firstInput = modal.querySelector('input');
        if (firstInput) firstInput.focus();
      }
    }

    function closeModal() {
      if (modal) {
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        if (btnAddVehicle) btnAddVehicle.focus();
      }
    }

    if (btnAddVehicle) btnAddVehicle.addEventListener('click', openModal);
    if (btnCloseModal) btnCloseModal.addEventListener('click', closeModal);
    if (btnCancelModal) btnCancelModal.addEventListener('click', closeModal);

    // Escape para cerrar diálogos
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (modal && !modal.classList.contains('hidden')) closeModal();
        if (dropdown && !dropdown.classList.contains('hidden')) {
          dropdown.classList.add('hidden');
          btnAccount.setAttribute('aria-expanded', 'false');
        }
      }
    });

    if (formVehicle) {
      formVehicle.addEventListener('submit', () => {
        closeModal();
      });
    }
  })();
</script></main></div>

</body></html>
