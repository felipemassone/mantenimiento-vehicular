<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#F6F4EF;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#ffffff", "status-error-text": "#B42318", "primary": "#002869", "status-uncertain-border": "#8C82D6", "secondary": "#785900", "on-secondary-fixed-variant": "#5b4300", "surface-container": "#EFECE5", "status-success-container": "#E5F2EA", "primary-hover": "#08306F", "status-warning-text": "#9A3412", "on-surface-variant": "#434652", "tertiary": "#27157f", "text-muted": "#5A6472", "secondary-fixed": "#ffdf9d", "surface-container-highest": "#dae3f4", "surface": "#f8f9ff", "primary-container": "#E3EAF6", "on-tertiary-container": "#ada4ff", "surface-container-lowest": "#ffffff", "on-tertiary-fixed-variant": "#43369b", "tertiary-container": "#3e3196", "secondary-fixed-dim": "#f9bd14", "outline": "#747783", "status-warning-container": "#FFEDD5", "border-outline": "#8A8F98", "on-surface": "#131c28", "status-uncertain-text": "#4B3FA3", "background-paper": "#F6F4EF", "secondary-container": "#fcc019", "on-error-container": "#93000a", "status-success-text": "#1E6B43", "error-container": "#ffdad6", "on-secondary-fixed": "#251a00", "on-tertiary-fixed": "#170065", "inverse-on-surface": "#eaf1ff", "surface-container-low": "#eff4ff", "tertiary-fixed-dim": "#c7bfff", "on-error": "#ffffff", "surface-variant": "#dae3f4", "status-error-container": "#FEE4E2", "on-background": "#131c28", "surface-dim": "#d1daeb", "surface-bright": "#f8f9ff", "on-primary-fixed": "#001947", "surface-container-high": "#e0e9f9", "tertiary-fixed": "#e4dfff", "on-secondary-container": "#6c5000", "inverse-primary": "#b1c5ff", "surface-card": "#FFFFFF", "on-primary-fixed-variant": "#144296", "on-primary": "#ffffff", "outline-variant": "#c4c6d3", "background": "#f8f9ff", "border-divider": "#E3DFD6", "text-ink": "#1B2430", "error": "#ba1a1a", "on-primary-container": "#8dadff", "primary-fixed": "#dae2ff", "status-uncertain-container": "#EDEBFA", "on-secondary": "#ffffff", "inverse-surface": "#28313d", "surface-tint": "#345baf", "primary-fixed-dim": "#b1c5ff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "space-lg": "1rem", "space-xl": "1.5rem", "gutter": "1rem", "space-sm": "0.5rem", "space-md": "0.75rem", "margin": "1rem", "margin-desktop": "2rem", "space-2xl": "2rem", "gutter-desktop": "1.5rem" }, "fontFamily": { "body-sm": ["Public Sans"], "headline-sm": ["Public Sans"], "label-md": ["Public Sans"], "headline-lg": ["Public Sans"], "data-tabular": ["Public Sans"], "km-display": ["Public Sans"], "body-md": ["Public Sans"], "caption": ["Public Sans"] }, "fontSize": { "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }] } } } }</script></head><body class="bg-background-paper font-body-md text-text-ink antialiased min-h-screen flex flex-col items-center"><div class="w-full max-w-[720px] min-h-screen flex flex-col relative"><header class="fixed top-0 max-w-[720px] w-full z-50 bg-background-paper/95 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 shadow-sm" style="background-color: #0B3D91;"><span class="material-symbols-outlined text-[20px]" style="color: #F2B705;">build</span></div><h1 class="font-headline-sm text-headline-sm text-text-ink truncate tracking-tight">Mis vehículos</h1></div><div class="flex items-center"><button aria-label="Cuenta de usuario" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center font-label-md text-text-ink font-medium select-none cursor-pointer transition-colors active:bg-border-divider" type="button"><span class="text-[14px] leading-none">FM</span></button></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-background-paper"><div class="flex flex-col w-full pb-6">

</span>
</div>
</article>
<!-- Tarjeta 2: Gol Trend -->
<article aria-label="Volkswagen Gol Trend 2016, 98.150 kilómetros. Todo al día. Ver detalles." class="bg-surface-card rounded-xl p-4 flex flex-col gap-3 cursor-pointer active:bg-surface-container/60 transition-colors" role="button" tabindex="0">
<div class="flex items-start justify-between gap-2">

<span class="font-body-sm text-body-sm text-text-muted mt-0.5">2016</span>
</div>
<div class="flex items-center gap-1.5 shrink-0 pt-0.5">

<span aria-hidden="true" class="material-symbols-outlined text-text-muted text-[20px]">chevron_right</span>
</div>
</div>
<div class="flex items-center gap-1.5 pt-1">
<!-- Chip Todo al día -->
<span class="inline-flex items-center gap-1 bg-status-success-container text-status-success-text px-2.5 py-1 rounded-full font-caption text-caption font-medium">
<span aria-hidden="true" class="material-symbols-outlined text-[15px]">check_circle</span>
<span class="">Todo al día</span>
</span>
</div>
</article>
</section>
<!-- Acción principal inferior -->
<div class="w-full mt-6">
<button class="w-full h-12 bg-primary hover:bg-primary-hover active:bg-primary-hover text-on-primary font-label-md text-label-md rounded-[10px] flex items-center justify-center gap-2 transition-colors select-none" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">add</span>

</div>
</div></main></div>
