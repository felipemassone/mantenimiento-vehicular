<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-bright": "#f8f9ff", "primary-container": "#0b3d91", "secondary-fixed-dim": "#f9bd14", "surface-tint": "#345baf", "on-secondary-fixed-variant": "#5b4300", "inverse-on-surface": "#eaf1ff", "on-primary-container": "#8dadff", "status-warning-text": "#9A3412", "on-primary-fixed-variant": "#144296", "surface-container-low": "#eff4ff", "secondary-fixed": "#ffdf9d", "on-secondary-fixed": "#251a00", "surface-container": "#EFECE5", "border-outline": "#8A8F98", "status-uncertain-container": "#EDEBFA", "primary": "#002869", "surface-card": "#FFFFFF", "text-muted": "#5A6472", "on-tertiary-container": "#ada4ff", "primary-hover": "#08306F", "primary-fixed": "#dae2ff", "status-uncertain-border": "#8C82D6", "status-success-text": "#1E6B43", "on-secondary": "#ffffff", "border-divider": "#E3DFD6", "tertiary": "#27157f", "secondary": "#785900", "text-ink": "#1B2430", "primary-fixed-dim": "#b1c5ff", "inverse-surface": "#28313d", "status-warning-container": "#FFEDD5", "on-error-container": "#93000a", "surface-container-lowest": "#ffffff", "tertiary-fixed": "#e4dfff", "surface-variant": "#dae3f4", "outline-variant": "#c4c6d3", "on-tertiary-fixed": "#170065", "outline": "#747783", "inverse-primary": "#b1c5ff", "on-surface-variant": "#434652", "on-surface": "#131c28", "surface-container-highest": "#dae3f4", "surface-dim": "#d1daeb", "background": "#f8f9ff", "status-error-container": "#FEE4E2", "tertiary-container": "#3e3196", "on-background": "#131c28", "surface-container-high": "#e0e9f9", "on-tertiary-fixed-variant": "#43369b", "on-primary-fixed": "#001947", "on-error": "#ffffff", "background-paper": "#F6F4EF", "secondary-container": "#fcc019", "error": "#ba1a1a", "error-container": "#ffdad6", "tertiary-fixed-dim": "#c7bfff", "on-tertiary": "#ffffff", "status-success-container": "#E5F2EA", "on-secondary-container": "#6c5000", "surface": "#f8f9ff", "status-uncertain-text": "#4B3FA3", "status-error-text": "#B42318", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "1.5rem", "margin-desktop": "2rem", "gutter-desktop": "1.5rem", "gutter": "1rem", "space-2xl": "2rem", "space-sm": "0.5rem", "space-md": "0.75rem", "space-xs": "0.25rem", "margin": "1rem", "space-lg": "1rem" }, fontFamily: { "body-sm": ["Public Sans"], "data-tabular": ["Public Sans"], "km-display": ["Public Sans"], "body-md": ["Public Sans"], "headline-sm": ["Public Sans"], "caption": ["Public Sans"], "headline-lg": ["Public Sans"], "label-md": ["Public Sans"] }, fontSize: { "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{background-color:#F6F4EF;color:#1B2430;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-background-paper font-body-md text-text-ink flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col w-full max-w-[720px] mx-auto px-margin py-margin bg-background-paper"><div class="flex flex-col w-full">
<div class="flex items-center gap-space-sm mb-space-2xl">
<div class="w-8 h-8 rounded-[8px] bg-primary flex items-center justify-center shrink-0">
<svg class="w-4 h-4 text-secondary-fixed-dim" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
</svg>
</div>
<span class="font-headline-sm text-headline-sm text-text-ink tracking-tight">Libreta de service</span>
</div>
<div class="mb-space-xl">
<h1 class="font-headline-lg text-headline-lg text-text-ink mb-space-xs tracking-tight">Crear cuenta</h1>
<p class="font-body-sm text-body-sm text-text-muted">Solo te pedimos un correo y una contraseña.</p>
</div>
<form class="flex flex-col gap-space-lg w-full" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="email">Correo electrónico</label>
<div class="relative w-full">
<input autocomplete="email" class="w-full h-12 px-3 bg-surface-card rounded-[10px] text-text-ink font-body-md text-body-md border border-border-outline focus:outline-none focus:border-2 focus:border-primary transition-colors" id="email" type="email" value="felipe.massone@gmail.com">
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-text-ink" for="password">Contraseña</label>
<div class="relative w-full">
<input autocomplete="new-password" class="w-full h-12 pl-3 pr-11 bg-surface-card rounded-[10px] text-text-ink font-body-md text-body-md border-[1.5px] border-status-error-text focus:outline-none transition-colors" id="password" type="password" value="1234">
<button aria-label="Mostrar contraseña" class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-text-ink transition-colors cursor-pointer" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<div class="flex items-center gap-1.5 mt-0.5">
<span class="material-symbols-outlined text-status-error-text text-[16px] shrink-0">error</span>
<span class="font-caption text-caption text-status-error-text">La contraseña tiene que tener al menos 8 caracteres.</span>
</div>

</div>
<div class="pt-space-xs">
<button class="w-full h-12 bg-primary hover:bg-primary-hover text-surface-card font-label-md text-label-md rounded-[10px] transition-colors flex items-center justify-center cursor-pointer active:scale-[0.99]" type="submit" style="background-color: rgb(11, 61, 145);">
        Crear cuenta
      </button>
</div>
</form>
<div class="mt-space-2xl text-center">
<p class="font-body-sm text-body-sm text-text-muted">
      ¿Ya tenés cuenta? 
      <a class="text-primary hover:text-primary-hover font-label-md underline underline-offset-2 ml-1" href="#">Ingresar</a>
</p>
</div>
</div>
<script>
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  }
</script></main>


</body></html>
