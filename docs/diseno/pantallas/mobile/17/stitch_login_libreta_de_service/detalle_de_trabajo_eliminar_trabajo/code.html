rface": "#eaf1ff", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#c7bfff", "secondary-fixed-dim": "#f9bd14", "outline": "#747783", "secondary-container": "#fcc019", "on-primary": "#ffffff", "tertiary-container": "#3e3196", "background-paper": "#F6F4EF", "surface-card": "#FFFFFF", "surface-dim": "#d1daeb", "outline-variant": "#c4c6d3", "surface-variant": "#dae3f4", "on-secondary-fixed-variant": "#5b4300", "status-uncertain-border": "#8C82D6", "border-divider": "#E3DFD6", "error": "#ba1a1a", "status-uncertain-container": "#EDEBFA", "primary": "#002869" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin": "1rem", "space-md": "0.75rem", "gutter": "1rem", "space-2xl": "2rem", "space-xl": "1.5rem", "gutter-desktop": "1.5rem", "space-sm": "0.5rem", "margin-desktop": "2rem", "space-xs": "0.25rem", "space-lg": "1rem" }, "fontFamily": { "body-sm": ["Public Sans"], "headline-lg": ["Public Sans"], "data-tabular": ["Public Sans"], "caption": ["Public Sans"], "label-md": ["Public Sans"], "body-md": ["Public Sans"], "km-display": ["Public Sans"], "headline-sm": ["Public Sans"] }, "fontSize": { "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "data-tabular": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "km-display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };</script></head><body class="bg-background-paper text-text-ink font-body-md text-body-md flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-background-paper/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Volver" class="inline-flex items-center gap-space-xs min-w-[44px] min-h-[44px] -ml-2 text-text-ink hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span><span class="font-label-md text-label-md">Volver</span></button><h1 class="font-headline-sm text-headline-sm text-text-ink truncate text-center flex-1 mx-space-sm">Aceite y filtro de aceite</h1><div aria-hidden="true" class="w-11 h-11"></div></div></header><main class="flex flex-col relative w-full px-margin pt-14 pb-safe bg-background-paper flex-1 max-w-[720px] mx-auto"><div class="flex flex-col w-full relative">
<!-- Dimmed Underneath Content (Estado 1) -->
<div aria-hidden="true" class="flex flex-col w-full opacity-60 pointer-events-none select-none pb-space-2xl"><!-- Main Service Card -->
<div class="bg-surface-card rounded-xl p-space-lg mb-space-lg flex flex-col gap-space-md shadow-sm">
  <div class="grid grid-cols-2 gap-space-md">
    <div class="flex flex-col">
      <span class="font-caption text-caption text-text-muted">Fecha</span>
      <span class="font-label-md text-label-md text-text-ink">10/10/2026</span>
    </div>
    <div class="flex flex-col">
      <span class="font-caption text-caption text-text-muted">Kilometraje</span>
      <span class="font-data-tabular text-data-tabular text-text-ink">62.400 km</span>
    </div>
    <div class="flex flex-col">
      <span class="font-caption text-caption text-text-muted">Taller</span>
      <span class="font-label-md text-label-md text-text-ink">Lubricentro San Martín</span>
    </div>
    <div class="flex flex-col">
      <span class="font-caption text-caption text-text-muted">Costo</span>
      <span class="font-data-tabular text-data-tabular text-text-ink">$ 85.000</span>
    </div>
  </div>
  <!-- Divider -->
  <div class="w-full h-[1px] bg-border-divider my-space-xs"></div>
  <!-- Comprobante Section -->
  <div class="flex flex-col gap-space-xs">
    <span class="font-caption text-caption text-text-muted">Comprobante</span>
    <div class="flex items-center justify-between bg-background-paper p-space-sm rounded-lg">
      <div class="flex items-center gap-space-sm">
        <span class="material-symbols-outlined text-text-muted text-[22px]">receipt_long</span>
        <div class="flex flex-col">
          <span class="font-label-md text-label-md text-text-ink">Factura_B_004812.pdf</span>
          <span class="font-caption text-caption text-text-muted">1.2 MB · 10/10/2026</span>
        </div>
      </div>
      <button type="button" class="text-body-sm font-label-md text-text-ink underline flex items-center gap-space-xs">
        <span class="">Ver en tamaño completo</span>
      </button>
    </div>
  </div>
</div>
<!-- Screen Secondary Buttons (Mocked Estado 1) -->
<div class="flex flex-col gap-space-sm w-full">
  <button class="w-full h-12 bg-surface-card text-text-ink rounded-[10px] font-label-md text-label-md flex items-center justify-center border border-border-divider shadow-sm" tabindex="-1" type="button">
    Editar
  </button>
  <button class="w-full h-12 bg-surface-card text-status-error-text rounded-[10px] font-label-md text-label-md flex items-center justify-center border border-border-divider shadow-sm" tabindex="-1" type="button">
    Eliminar trabajo
  </button>
</div></div>
<!-- Dimmed Modal Backdrop -->
<div aria-describedby="dialog-desc" aria-labelledby="dialog-title" aria-modal="true" class="fixed inset-0 z-40 bg-[#1B2430]/45 flex items-center justify-center px-margin" id="modal-backdrop" role="dialog">
<!-- Confirmation Dialog Card -->
<div class="w-full max-w-[400px] bg-surface-card rounded-[14px] p-6 shadow-sm flex flex-col">
<h2 class="font-headline-sm text-[18px] leading-[24px] font-semibold text-text-ink mb-space-sm" id="dialog-title">
        ¿Eliminar este trabajo?
      </h2>
<p class="font-body-sm text-[15px] leading-[22px] text-text-muted mb-space-xl" id="dialog-desc">
        Se borran el trabajo y su comprobante. El plan vuelve a contar desde el trabajo anterior.
      </p>
<!-- Actions Row -->
<div class="flex items-center gap-space-sm w-full">
<button class="flex-1 h-12 bg-surface-card text-text-ink rounded-[10px] font-label-md text-label-md hover:bg-background-paper transition-colors flex items-center justify-center shadow-none active:scale-[0.99]" id="btn-cancel" type="button">
          Cancelar
        </button>
<button class="flex-1 h-12 bg-status-error-text text-on-error rounded-[10px] font-label-md text-label-md hover:bg-[#991B1B] transition-colors flex items-center justify-center shadow-none active:scale-[0.99]" id="btn-confirm-delete" type="button">
          Eliminar
        </button>
</div>
</div>
</div>
<script>
    (function () {
      const cancelBtn = document.getElementById('btn-cancel');
      const deleteBtn = document.getElementById('btn-confirm-delete');
      const backdrop = document.getElementById('modal-backdrop');

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          if (window.history.length > 1) {
            window.history.back();
          } else if (backdrop) {
            backdrop.style.display = 'none';
          }
        });
      }

      if (deleteBtn) {
        deleteBtn.addEventListener('click', () => {
          deleteBtn.disabled = true;
          deleteBtn.textContent = 'Eliminando...';
          setTimeout(() => {
            if (window.history.length > 1) {
              window.history.back();
            }
          }, 400);
        });
      }
    })();
  </script>
</div></main>

</body></html>
