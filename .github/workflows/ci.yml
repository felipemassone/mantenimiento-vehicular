name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # prisma generate lee prisma.config.ts, que exige DIRECT_URL aunque no se conecte
      DIRECT_URL: postgresql://localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unitarias con el umbral de cobertura del motor (RNF-12)
      - run: npm run test:cobertura

  # Integración y punta a punta usan el proyecto de Supabase de desarrollo.
  # Un PR desde un fork no recibe secretos: estos jobs se saltean.
  # El grupo "base-dev" es común a todas las ramas: de a un job por vez sobre la base. Dos corridas
  # cruzadas (main tras un merge y el PR siguiente) la saturaban: el 15/10/2026 la baja de la cuenta
  # de la e2e tardó más de 15 s. GitHub deja uno corriendo y uno en espera por grupo.
  integracion:
    needs: verificar
    concurrency:
      group: base-dev
      cancel-in-progress: false
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La base dev sigue a la rama que se prueba (las migraciones son aditivas).
      - run: npx prisma migrate deploy
      - run: npm run test:integracion

  e2e:
    needs: integracion
    concurrency:
      group: base-dev
      cancel-in-progress: false
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # RNF-09: el recorrido corre en los cuatro (Edge estable, instalado con su paquete).
      - run: npx playwright install --with-deps chromium firefox webkit msedge
      - run: npm run test:e2e
      # El informe y la traza solo usan la cuenta descartable de la prueba.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # RNF-13: producción se despliega desde acá, solo en main y con los tres checks en verde.
  # Vercel compila con sus variables de Production; no depende de su conexión con GitHub.
  desplegar:
    needs: [verificar, integracion, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://mantenimiento-vehicular-ten.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes vercel@63 deploy --prod --yes --token "$VERCEL_TOKEN"

  # Vista previa de cada rama (informe, 6.1.2), contra el proyecto de Supabase de desarrollo.
  # No en los PR de Dependabot: el token de Vercel no se le da a código de dependencias nuevas.
  vista-previa:
    needs: verificar
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          url=$(npx --yes vercel@63 deploy --yes --token "$VERCEL_TOKEN")
          echo "### Vista previa: $url" >> "$GITHUB_STEP_SUMMARY"
